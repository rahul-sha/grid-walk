name: Check version

# Every pull request that changes the site must raise the version in
# package.json (shown on the About card). See scripts/check-version-bump.mjs
# for which files count and how to choose the new number.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version-bump.mjs ${{ github.event.pull_request.base.sha }}
